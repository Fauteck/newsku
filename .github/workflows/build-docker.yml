name: Build & Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/newsku
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Erster Lauf bewusst mit continue-on-error: Die JUnit-Suite lief bisher
  # nirgends (das JAR wird mit -DskipTests gebaut), ihr Zustand ist deshalb
  # unbekannt. Lokal am 2026-08-26 geprueft: 67 Tests, 0 Failures, 35 Errors —
  # alle 35 aus TestContainers-Klassen, die ohne Docker-Daemon nicht starten.
  # Auf ubuntu-latest gibt es einen Docker-Daemon, hier faellt also zum ersten
  # Mal ein echtes Ergebnis an.
  #
  # Sobald der Job zweimal gruen durchlaeuft: continue-on-error entfernen UND
  # in build-and-push `needs: quality` ergaenzen. Erst dann ist es ein Gate —
  # solange beides fehlt, ist dieser Job eine Messung, keine Zusage. Das steht
  # so auch in CLAUDE.md §5/§5a; wer das eine aendert, aendert das andere mit.
  quality:
    name: Test (informativ, noch kein Gate)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret-Scan (detect-secrets)
        run: |
          python3 -m pip install --quiet detect-secrets==1.5.0
          detect-secrets-hook --baseline .secrets.baseline $(git ls-files)


      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Run JUnit suite
        run: mvn --batch-mode --no-transfer-progress test

      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  build-and-push:
    name: Build JAR & Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter Web
        working-directory: src/main/app
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build web --release

      - name: Copy Flutter Web build into Spring Boot static resources
        run: |
          mkdir -p src/main/resources/static
          cp -r src/main/app/build/web/. src/main/resources/static/

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Build JAR with Maven
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
