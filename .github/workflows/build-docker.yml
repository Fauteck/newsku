name: Build & Push Docker Image

# Genau ein Ausloeser: workflow_dispatch. Ein Merge erzeugt kein Image — den
# Workflow startet der Maintainer von Hand (Actions-Tab -> Run workflow).
# Damit gilt hier dieselbe Regel wie in todo, kassenbuch, tourteck und
# pruefteck: das Gate ist der Dispatch, nicht der Merge.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/newsku
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate vor jedem Image-Build: JUnit-Suite plus Doku-Kontrakt.
  # build-and-push deklariert `needs: quality` — ohne gruenes Gate entsteht
  # kein Image. Ein neues Gate kommt als weiterer Schritt in diesen Job, nie
  # als zweiter Workflow.
  quality:
    name: Test & Doku-Kontrakt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret-Scan (detect-secrets)
        run: |
          python3 -m pip install --quiet detect-secrets==1.5.0
          detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Doku-Kontrakt
        run: python3 scripts/docs-guard.py

      - name: Run JUnit suite
        run: mvn --batch-mode --no-transfer-progress test

      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  build-and-push:
    name: Build JAR & Docker Image
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter Web
        working-directory: src/main/app
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build web --release

      - name: Copy Flutter Web build into Spring Boot static resources
        run: |
          mkdir -p src/main/resources/static
          cp -r src/main/app/build/web/. src/main/resources/static/

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Build JAR with Maven
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
